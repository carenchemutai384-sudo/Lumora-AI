<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumora AI | Illuminate Your Learning</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Lumora AI">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="predict.html">Predict</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="study-plan.html">Study Plan</a>
            <a href="#chat-section">AI Coach</a>
        </nav>
    </header>

    <!-- ================= CHAT SECTION ================= -->
    <main id="chat-section" class="chat-container">
        <div class="chat-card">
            <div class="chat-header">
                <h2>Lumora AI Coach 🤖</h2>
            </div>
            
            <!-- Message history container -->
            <div id="chatWindow">
                <div class="msg bot">Hello! How can I assist your study session today?</div>
            </div>

            <!-- Input area -->
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Ask your AI Coach anything..." />
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </main>

    <!-- JS loaded from a non-API path -->
    <script src="js/chat.js"></script>
</body>
</html>
